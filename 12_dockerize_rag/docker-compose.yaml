services:
  backend:
    container_name: backend
    # platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfiles/backend.dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    image: backend:v1


  frontend:
    container_name: frontend
    # platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfiles/frontend.dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
    image: frontend:v1

